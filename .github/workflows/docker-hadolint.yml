# Managed by Anubis onboarding: the logic lives in luuna-tech/security-platform.
name: Hadolint
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  hadolint:
    uses: luuna-tech/security-platform/.github/workflows/docker-hadolint.yml@master
    secrets: inherit
    with:
      anubis-team: shipping
