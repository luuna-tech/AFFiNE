# ──────────────────────────────────────────────────────────────────────────────
# SCA — Software Composition Analysis with OSV-Scanner v2
#
# Escaneo poliglota: --recursive . hace que OSV-Scanner detecte por sí solo
# cualquier manifiesto/lockfile soportado que exista en el repo (package-lock.json
# para Node.js, Pipfile.lock/requirements.txt para Python, etc.) sin necesidad
# de lógica condicional — si mañana se agrega código en el otro lenguaje, este
# mismo workflow lo recoge automáticamente.
#
# Genera SARIF y lo sube explícitamente al tab Security → Code scanning
# mediante github/codeql-action/upload-sarif@v3.
#
# fail-on-vuln: false — este repo tiene vulnerabilidades intencionales.
# continue-on-error: true en el step del scanner para que el upload-sarif
# siempre se ejecute aunque el scanner detecte CVEs.
#
# Expected findings (CVEs en las versiones pinneadas):
#   • lodash 4.17.15     — CVE-2019-10744, CVE-2020-8203, CVE-2021-23337
#   • minimist 1.2.5     — CVE-2021-44906
#   • node-fetch 2.6.0   — CVE-2022-0235
#   • ejs 3.1.6          — CVE-2022-29078
#   • axios 0.21.1       — CVE-2021-3749
#   • jsonwebtoken 8.5.1 — CVE-2022-23529, CVE-2022-23540, CVE-2022-23541
#   • serialize-js 2.1.2 — CVE-2020-7660
#
# Reutilizable desde otros repos (workflow_call). Ejemplo de caller:
#
#   name: SCA — OSV-Scanner
#   on:
#     push: { branches: [develop] }
#     pull_request: { branches: [develop] }
#     schedule: [{ cron: "0 8 * * 1" }]
#   permissions: { contents: read, security-events: write, actions: read }
#   jobs:
#     osv:
#       uses: luuna-tech/security-platform/.github/workflows/osv-scanner-sca.yml@master
#       secrets: inherit   # ANUBIS_URL / ANUBIS_TOKEN (secrets org-wide)
#       # with: { anubis-team: wms }   # o variable de repo ANUBIS_TEAM
#
# Solo se ingesta a Anubis desde la rama develop (push a develop o cron; en
# cron el checkout se fuerza a develop, que debe existir en el repo).
# Los triggers los define el caller; aquí solo vive la lógica. Cambios en este
# archivo (rama @master) se propagan a todos los repos en su siguiente corrida.
# ──────────────────────────────────────────────────────────────────────────────

name: "SCA — OSV-Scanner Dependency Scan"

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
  workflow_call:
    inputs:
      anubis-team:
        description: "Grupo/equipo en Anubis. Si se omite, usa la variable de repo ANUBIS_TEAM."
        type: string
        default: ""
      node-version:
        description: "Versión de Node para generar package-lock.json (si hay package.json)."
        type: string
        default: "22"
  schedule:
    - cron: "30 12 * * 1"   # lunes a las 12:30 UTC

permissions:
  actions: read
  contents: read
  security-events: write   # requerido por upload-sarif

jobs:
  # ── Job 1: genera package-lock.json y lo sube como artefacto ─────────────
  generate-lockfile:
    name: Generate package-lock.json
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}

      - name: Detectar package.json
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "has_node=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_node=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.detect.outputs.has_node == 'true'
        with:
          node-version: ${{ inputs.node-version || '22' }}

      - name: Resolve dependency tree
        if: steps.detect.outputs.has_node == 'true'
        run: npm install --package-lock-only --ignore-scripts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.detect.outputs.has_node == 'true'
        with:
          name: lockfile
          path: package-lock.json
          retention-days: 1

  # ── Job 2: escaneo completo en push/schedule ──────────────────────────────
  osv-scan-full:
    name: OSV-Scanner — full scan
    needs: generate-lockfile
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true   # sin package.json no hay artefacto
        with:
          name: lockfile

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        continue-on-error: true
        with:
          # --recursive . detecta automáticamente package-lock.json (Node.js)
          # y Pipfile.lock/requirements.txt (Python) donde existan.
          scan-args: |-
            --recursive
            .
            --format=sarif
            --output=osv-results.sarif
          fail-on-vuln: false

      # Segunda corrida en el JSON nativo de osv-scanner (--format=json, no
      # SARIF): el parser de Anubis (findings/parsers/osv_scanner.py) espera
      # la forma nativa (results[].source/packages[].package/vulnerabilities),
      # que el SARIF de arriba no tiene. osv-scanner no soporta pedir los dos
      # formatos en una sola invocación.
      - name: Run OSV-Scanner (JSON, para Anubis)
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        continue-on-error: true
        with:
          scan-args: |-
            --recursive
            .
            --format=json
            --output=osv-results.json
          fail-on-vuln: false

      # Deshabilitado temporalmente: Code Security/Code scanning no está
      # habilitado todavía para este repo (falta permiso de Admin/Owner del
      # org). Los hallazgos siguen disponibles vía el artefacto de abajo
      # mientras se despliega la plataforma propia de findings.
      # - name: Upload SARIF to GitHub Security
      #   uses: github/codeql-action/upload-sarif@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
      #   if: always()
      #   with:
      #     sarif_file: osv-results.sarif
      #     category: osv-scanner

      - name: Subir SARIF como artefacto (respaldo)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          # Nombre fijo: queda disponible para descarga manual o para la
          # futura Reports API.
          name: osv-sarif
          path: osv-results.sarif
          retention-days: 30

      - name: Subir JSON como artefacto (respaldo, para depurar la ingesta)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: osv-json
          path: osv-results.json
          retention-days: 30

      - name: Generar resumen de hallazgos
        if: always()
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          count=$(jq '[.runs[].results[]] | length' osv-results.sarif)
          jq -n \
            --arg tool "osv-scanner" \
            --arg repo "$REPO" \
            --arg ref "$REF" \
            --arg sha "$SHA" \
            --argjson run_id "$RUN_ID" \
            --argjson run_number "$RUN_NUMBER" \
            --arg event "$EVENT_NAME" \
            --argjson findings_count "$count" \
            '{tool: $tool, repo: $repo, ref: $ref, commit: $sha, run_id: $run_id, run_number: $run_number, triggered_by: $event, findings_count: $findings_count}' \
            > report-summary.json
          cat report-summary.json

      # Solo este job (osv-scan-full), nunca osv-scan-pr: un scan de PR corre
      # sobre la rama de la PR, no sobre main, y sync_findings_for_scan en
      # Anubis asume que cada ingesta es un scan completo del repo (auto-
      # resuelve cualquier hallazgo abierto que no venga en esta corrida) —
      # ingerir scans de PR resolvería por error hallazgos que siguen
      # vigentes en main.
      - name: Validar que ANUBIS_TEAM está configurado
        if: always() && (github.ref_name == 'develop' || github.event_name == 'schedule')
        env:
          ANUBIS_TEAM: ${{ inputs.anubis-team || vars.ANUBIS_TEAM }}
        run: |
          if [ -z "$ANUBIS_TEAM" ]; then
            echo "::error::La variable de repo ANUBIS_TEAM no está configurada (Settings > Secrets and variables > Actions > Variables). Es obligatoria para reportar hallazgos a Anubis."
            exit 1
          fi

      - name: Enviar hallazgos a Anubis
        if: always() && (github.ref_name == 'develop' || github.event_name == 'schedule')
        continue-on-error: true
        env:
          # security-platform reporta a la instancia de develop; el resto de
          # repos a prod. github.repository es el repo caller aun en workflow_call.
          ANUBIS_URL: ${{ github.repository == 'luuna-tech/security-platform' && secrets.ANUBIS_URL_DEV || secrets.ANUBIS_URL }}
          ANUBIS_TOKEN: ${{ github.repository == 'luuna-tech/security-platform' && secrets.ANUBIS_TOKEN_DEV || secrets.ANUBIS_TOKEN }}
          ANUBIS_TEAM: ${{ inputs.anubis-team || vars.ANUBIS_TEAM }}
          REPO: ${{ github.repository }}
          # Siempre develop: en cron el checkout es de develop, no de la rama
          # por defecto, así que github.sha/ref_name no aplican.
          BRANCH: develop
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          SHA=$(git rev-parse HEAD)
          curl --fail --silent --show-error \
            --max-time 30 \
            --request POST \
            --url "${ANUBIS_URL}/api/findings/ingest/osv-scanner/?repository=${REPO}&commit_sha=${SHA}&branch=${BRANCH}&team=${ANUBIS_TEAM}" \
            --header "Authorization: Token ${ANUBIS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @osv-results.json

  # ── Job 3: escaneo en pull_request ────────────────────────────────────────
  osv-scan-pr:
    name: OSV-Scanner — PR scan
    needs: generate-lockfile
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true   # sin package.json no hay artefacto
        with:
          name: lockfile

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        continue-on-error: true
        with:
          # --recursive . detecta automáticamente package-lock.json (Node.js)
          # y Pipfile.lock/requirements.txt (Python) donde existan.
          scan-args: |-
            --recursive
            .
            --format=sarif
            --output=osv-results.sarif
          fail-on-vuln: false

      # Deshabilitado temporalmente: Code Security/Code scanning no está
      # habilitado todavía para este repo (falta permiso de Admin/Owner del
      # org). Los hallazgos siguen disponibles vía el artefacto de abajo
      # mientras se despliega la plataforma propia de findings.
      # - name: Upload SARIF to GitHub Security
      #   uses: github/codeql-action/upload-sarif@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
      #   if: always()
      #   with:
      #     sarif_file: osv-results.sarif
      #     category: osv-scanner

      - name: Subir SARIF como artefacto (respaldo)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7

        if: always()
        with:
          name: osv-sarif
          path: osv-results.sarif
          retention-days: 30

      - name: Generar resumen de hallazgos
        if: always()
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          count=$(jq '[.runs[].results[]] | length' osv-results.sarif)
          jq -n \
            --arg tool "osv-scanner" \
            --arg repo "$REPO" \
            --arg ref "$REF" \
            --arg sha "$SHA" \
            --argjson run_id "$RUN_ID" \
            --argjson run_number "$RUN_NUMBER" \
            --arg event "$EVENT_NAME" \
            --argjson findings_count "$count" \
            '{tool: $tool, repo: $repo, ref: $ref, commit: $sha, run_id: $run_id, run_number: $run_number, triggered_by: $event, findings_count: $findings_count}' \
            > report-summary.json
          cat report-summary.json

      # Este job (osv-scan-pr) deliberadamente NO ingiere a Anubis: un scan
      # de PR corre sobre la rama de la PR, no sobre main, y
      # sync_findings_for_scan asume que cada ingesta es un scan completo
      # del repo — mandarlo aquí auto-resolvería por error hallazgos que
      # siguen vigentes en main. Solo el job osv-scan-full (arriba) ingiere.
